name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Linting con ruff
        run: ruff check .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commits_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_DB_PASSWORD: ci_app_password
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: commits_db
      DB_USER: app_ia
      DB_PASSWORD: ci_app_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest==8.3.4 httpx==0.27.2
      - name: Cliente psql 16 (init.sql usa \getenv, requiere psql >= 15)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version
      - name: Aplicar db/init.sql (rol app_ia con privilegios mínimos)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d commits_db -v ON_ERROR_STOP=1 -f db/init.sql
      - name: Pruebas con pytest
        run: pytest -v

  docker:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: clasificador-commits:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verificar usuario no-root (UID 1001)
        run: |
          uid=$(docker run --rm --entrypoint id clasificador-commits:ci -u)
          echo "UID del contenedor: $uid"
          test "$uid" = "1001"
